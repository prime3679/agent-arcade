<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="A read-only operational signal report generated from local probes." />
    <meta name="theme-color" content="#f3efe4" />
    <title>Signal Room · Operations</title>
    <link rel="stylesheet" href="./style.css?v=d442d761738d" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to signals</a>
    <main id="main" class="report">
      <header class="masthead">
        <p class="edition">Operations · read-only</p>
        <h1>Signal Room</h1>
        <p class="as-of" id="as-of" aria-live="polite">Reading snapshot…</p>
        <p class="sample-notice" id="sample-notice" hidden>Sample data — not live</p>
      </header>

      <section class="verdict" aria-labelledby="verdict-title">
        <h2 id="verdict-title">The verdict</h2>
        <p id="verdict-copy" aria-live="polite">Checking the four signals.</p>
      </section>

      <section class="signals" aria-labelledby="signals-title">
        <header class="section-heading">
          <h2 id="signals-title">Signals</h2>
          <span>Four read-only checks</span>
        </header>
        <div id="signal-list" class="signal-list" aria-live="polite"></div>
      </section>

      <section class="day-ahead" aria-labelledby="day-ahead-title">
        <header class="section-heading">
          <h2 id="day-ahead-title">The Day Ahead</h2>
          <span id="schedule-summary">Next 24 hours</span>
        </header>
        <ol id="schedule-list" class="schedule-list"></ol>
      </section>

      <footer class="colophon" id="colophon">
        Generated by read-only probes · no sends, no config writes · history unavailable
      </footer>
    </main>
    <script src="./app.js?v=03fc6202a6ea"></script>
  </body>
</html>
